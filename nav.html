<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 90vh;
            display: flex;
            justify-content: center;
            justify-content: space-evenly;
            align-items: center;
        }
        .flipper{
            /* border-radius: 5px; */
           width: 300px;
           height: 400px; 
           perspective: 800px;
        }
        .card-container{
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: 1s ease-out;
        
        }
         .flipper:hover .card-container{
            transform: rotatey(180deg);
         }
        .card{
            width: 100%;
            height: 100%;
             border-radius: 10px;
            position: absolute;
            backface-visibility: hidden;
        }
        .front{
             background-image: url(https://media.craftyartapp.com/uploadedFiles/thumb_file/27d9b3b5c36443001f5b683a4b57b44b30ebc78f1753945025.jpg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
              transform: rotateY(180deg);
        }
        .back{
            background-image: url(https://tse4.mm.bing.net/th/id/OIP.r-p6HB-JeSoh1ET10RzcbwHaLH?r=0&rs=1&pid=ImgDetMain&o=7&rm=3);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            /* transform: rotateY(180deg); */
        }
    </style>
</head>
<body>
    <div class="flipper">
        <div class="card-container">
            <div class="card front"></div>
            <div class="card back"></div> 
        </div>
   </div>
    <div class="flipper">
        <div class="card-container">
            <div class="card front"></div>
            <div class="card back"></div>
        </div>
   </div>
    <div class="flipper">
        <div class="card-container">
            <div class="card front"></div>
            <div class="card back"></div>
        </div>
   </div>
</body>
</html>
