<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>border image</title>
    <style>
        .container{
            width: 350px;
            height: 400px;
            border: 30px solid #000;
            /* border-image: ; */
            background-color: green;
            border-image-source: url(https://marketplace.canva.com/EAFBe2Su9es/1/0/1131w/canva-blue-aesthetic-leaf-paper-border-b_RDkLP9Zt0.jpg);
            border-image-slice:40;
            border-image-repeat:round;
            border-image-width:30px;
            border-image-outset:50px;
        }
    </style>
</head>
<body>
    <div class="container">

    </div>
</body>
</html>
