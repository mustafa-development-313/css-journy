            animation-duration: 2s;

        }

        @keyframes move {
            /* from{transform: translateX(0px);background-color: red; font-size: 20px;}
            to{transform: translateX(400px);background-color: green;font-size: 50px;} */

            25%{transform: translateX(400px);}

            70%{transform: translateX(-400px);}
            100%{transform: translateX(0);}
        }
